[package]
name = "kestrel-telemetry"
version = "0.11.4"
edition = "2021"
rust-version = "1.78"
description = "Drone telemetry ingest for the Kestrel medical delivery platform"
publish = false

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
rumqttc = { version = "0.24", features = ["use-rustls"] }
rdkafka = { version = "0.36", features = ["cmake-build", "ssl"] }
axum = "0.7"
config = { version = "0.14", default-features = false, features = ["toml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
mavlink = { version = "0.13", default-features = false, features = ["std", "common", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
anyhow = "1"
moka = { version = "0.12", features = ["future"] }
kestrel-contracts = { git = "https://github.com/roykaushik07/kestrel-contracts", tag = "v3.2.0" }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
