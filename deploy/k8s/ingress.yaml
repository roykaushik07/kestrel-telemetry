apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kestrel-telemetry
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: telemetry.internal.kestrel-air.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kestrel-telemetry
                port:
                  number: 80
